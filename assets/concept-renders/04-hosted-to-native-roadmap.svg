<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ainix hosted to native roadmap</title>
  <desc id="desc">A roadmap render showing Ainix from hosted Windows runtime to native OS layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071014"/>
      <stop offset="0.5" stop-color="#11191a"/>
      <stop offset="1" stop-color="#171008"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c7d1cc"/>
    </marker>
    <style>
      .sans { font-family: Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 60px; font-weight: 780; fill: #f7faf8; letter-spacing: 0; }
      .subtitle { font-size: 25px; fill: #b8c7c1; letter-spacing: 0; }
      .stage { font-size: 28px; font-weight: 760; fill: #f1f6f3; letter-spacing: 0; }
      .body { font-size: 20px; fill: #c0cbc6; letter-spacing: 0; }
      .small { font-size: 17px; fill: #9aa8a3; letter-spacing: 0; }
      .card { fill: rgba(255,255,255,0.065); stroke: rgba(255,255,255,0.16); stroke-width: 1.4; }
      .now { fill: rgba(73,211,145,0.13); stroke: rgba(73,211,145,0.54); }
      .next { fill: rgba(101,215,223,0.12); stroke: rgba(101,215,223,0.52); }
      .later { fill: rgba(240,184,76,0.12); stroke: rgba(240,184,76,0.52); }
      .native { fill: rgba(236,104,86,0.10); stroke: rgba(236,104,86,0.48); }
      .arrow { stroke: #c7d1cc; stroke-width: 3; stroke-opacity: 0.7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M110 735 C390 610 640 820 900 650 C1110 512 1290 565 1510 420" fill="none" stroke="#65d7df" stroke-opacity="0.15" stroke-width="3"/>
  <path d="M110 790 C425 704 630 850 940 720 C1175 620 1330 654 1510 555" fill="none" stroke="#f0b84c" stroke-opacity="0.13" stroke-width="3"/>

  <text class="sans title" x="78" y="74">Hosted first. Native later.</text>
  <text class="sans subtitle" x="82" y="144">Ainix can consume platforms before it becomes one.</text>

  <g transform="translate(82 245)">
    <rect class="card now" width="320" height="365" rx="20"/>
    <text class="sans stage" x="28" y="52">1. Hosted runtime</text>
    <text class="sans body" x="28" y="98">Runs on Windows, Linux,</text>
    <text class="sans body" x="28" y="128">and macOS as a local</text>
    <text class="sans body" x="28" y="158">semantic OS layer.</text>
    <text class="sans small" x="28" y="220">Current proof:</text>
    <text class="sans small" x="28" y="250">M6 extension runtime</text>
    <text class="sans small" x="28" y="280">daemon IPC, audit, replay</text>
    <text class="sans small" x="28" y="310">local API hardening</text>
  </g>

  <line class="arrow" x1="426" y1="427" x2="500" y2="427"/>

  <g transform="translate(526 245)">
    <rect class="card next" width="320" height="365" rx="20"/>
    <text class="sans stage" x="28" y="52">2. Windows host</text>
    <text class="sans body" x="28" y="98">Register local models,</text>
    <text class="sans body" x="28" y="128">consume Aion/Windows ML,</text>
    <text class="sans body" x="28" y="158">preserve app compatibility.</text>
    <text class="sans small" x="28" y="220">Wedge:</text>
    <text class="sans small" x="28" y="250">folder -> lattice -> agents</text>
    <text class="sans small" x="28" y="280">artifact -> export back</text>
    <text class="sans small" x="28" y="310">proof, not replacement</text>
  </g>

  <line class="arrow" x1="870" y1="427" x2="944" y2="427"/>

  <g transform="translate(970 245)">
    <rect class="card later" width="320" height="365" rx="20"/>
    <text class="sans stage" x="28" y="52">3. Primary shell</text>
    <text class="sans body" x="28" y="98">Canvas, presence, agents,</text>
    <text class="sans body" x="28" y="128">policies, sync, and tools</text>
    <text class="sans body" x="28" y="158">become the daily surface.</text>
    <text class="sans small" x="28" y="220">Surfaces:</text>
    <text class="sans small" x="28" y="250">screen, touch, voice</text>
    <text class="sans small" x="28" y="280">AR/VR control rooms</text>
    <text class="sans small" x="28" y="310">team shared spaces</text>
  </g>

  <line class="arrow" x1="1290" y1="427" x2="1364" y2="427"/>

  <g transform="translate(1310 245)">
    <rect class="card native" width="210" height="365" rx="20"/>
    <text class="sans stage" x="24" y="52">4. Native</text>
    <text class="sans body" x="24" y="98">Kernel</text>
    <text class="sans body" x="24" y="128">scheduler</text>
    <text class="sans body" x="24" y="158">storage</text>
    <text class="sans body" x="24" y="188">IPC</text>
    <text class="sans body" x="24" y="218">session</text>
    <text class="sans small" x="24" y="280">Same contracts,</text>
    <text class="sans small" x="24" y="310">lower layer.</text>
  </g>

  <g transform="translate(82 696)">
    <rect class="card" width="1438" height="92" rx="18"/>
    <text class="sans stage" x="30" y="40">Strategic message</text>
    <text class="sans body" x="30" y="70">Ainix does not start by fighting host operating systems. It gives them an agent-native migration layer.</text>
  </g>
</svg>
