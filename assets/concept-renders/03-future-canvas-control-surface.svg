<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Future Ainix canvas control surface</title>
  <desc id="desc">A concept render of a future Ainix infinite canvas with lattice nodes and agent activity.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="78%">
      <stop offset="0" stop-color="#17313a"/>
      <stop offset="0.45" stop-color="#0c171a"/>
      <stop offset="1" stop-color="#06090a"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans { font-family: Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 58px; font-weight: 780; fill: #f7faf8; letter-spacing: 0; }
      .subtitle { font-size: 25px; fill: #bac8c3; letter-spacing: 0; }
      .label { font-size: 22px; font-weight: 720; fill: #f0f6f3; letter-spacing: 0; }
      .small { font-size: 18px; fill: #a3b1ac; letter-spacing: 0; }
      .tiny { font-size: 15px; fill: #9ca9a5; letter-spacing: 0; }
      .panel { fill: rgba(255,255,255,0.075); stroke: rgba(255,255,255,0.17); stroke-width: 1.3; }
      .node { fill: rgba(101,215,223,0.16); stroke: #65d7df; stroke-width: 2; }
      .agent { fill: rgba(73,211,145,0.16); stroke: #49d391; stroke-width: 2; }
      .warn { fill: rgba(240,184,76,0.16); stroke: #f0b84c; stroke-width: 2; }
      .edge { stroke: #6d8989; stroke-opacity: 0.46; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.34">
    <path d="M0 610 C220 520 390 640 610 555 C850 462 1020 520 1230 450 C1390 397 1490 390 1600 365" fill="none" stroke="#65d7df" stroke-width="2"/>
    <path d="M0 682 C260 602 450 710 760 602 C1010 515 1210 590 1600 505" fill="none" stroke="#f0b84c" stroke-width="2"/>
    <path d="M260 200 C350 330 290 480 430 610 C550 720 740 700 890 790" fill="none" stroke="#49d391" stroke-width="2"/>
  </g>

  <text class="sans title" x="78" y="74">Future Ainix canvas</text>
  <text class="sans subtitle" x="82" y="144">The production idea: an everyday control surface over lattice state, agents, context, and authority.</text>

  <g transform="translate(95 220)">
    <rect class="panel" width="310" height="520" rx="18"/>
    <text class="sans label" x="26" y="42">Session</text>
    <text class="sans small" x="26" y="78">Urban planning review</text>
    <rect class="panel" x="24" y="112" width="262" height="68" rx="12"/>
    <text class="sans tiny" x="42" y="142">Active agent</text>
    <text class="sans label" x="42" y="168">Deck Builder</text>
    <rect class="panel" x="24" y="206" width="262" height="68" rx="12"/>
    <text class="sans tiny" x="42" y="236">Capability</text>
    <text class="sans label" x="42" y="262">lattice.read scoped</text>
    <rect class="panel" x="24" y="300" width="262" height="96" rx="12"/>
    <text class="sans tiny" x="42" y="330">Approval needed</text>
    <text class="sans label" x="42" y="358">Export Q3 board</text>
    <text class="sans small" x="42" y="384">Preview before apply</text>
    <rect class="panel" x="24" y="424" width="262" height="62" rx="12"/>
    <text class="sans label" x="42" y="462">Audit trail live</text>
  </g>

  <g filter="url(#glow)">
    <path class="edge" d="M670 365 L850 280 L1045 360 L985 565 L735 590 Z"/>
    <path class="edge" d="M850 280 L880 455 L735 590"/>
    <path class="edge" d="M880 455 L1045 360"/>
    <path class="edge" d="M880 455 L985 565"/>

    <circle class="node" cx="670" cy="365" r="62"/>
    <circle class="node" cx="850" cy="280" r="56"/>
    <circle class="warn" cx="1045" cy="360" r="64"/>
    <circle class="node" cx="985" cy="565" r="58"/>
    <circle class="agent" cx="735" cy="590" r="62"/>
    <circle class="agent" cx="880" cy="455" r="76"/>
  </g>
  <text class="sans label" x="628" y="371">Project</text>
  <text class="sans small" x="626" y="399">source files</text>
  <text class="sans label" x="815" y="286">Context</text>
  <text class="sans small" x="810" y="314">packet</text>
  <text class="sans label" x="1005" y="365">Policy</text>
  <text class="sans small" x="990" y="393">approval</text>
  <text class="sans label" x="949" y="571">Output</text>
  <text class="sans small" x="936" y="599">artifact</text>
  <text class="sans label" x="694" y="596">Agent</text>
  <text class="sans small" x="683" y="624">delegate</text>
  <text class="sans label" x="828" y="451">Canvas</text>
  <text class="sans small" x="812" y="480">lattice view</text>

  <g transform="translate(1170 220)">
    <rect class="panel" width="330" height="520" rx="18"/>
    <text class="sans label" x="26" y="42">Control modes</text>
    <text class="sans small" x="26" y="82">Screen</text>
    <text class="sans small" x="26" y="126">Touch</text>
    <text class="sans small" x="26" y="170">Voice</text>
    <text class="sans small" x="26" y="214">AR workspace</text>
    <text class="sans small" x="26" y="258">VR review room</text>
    <rect class="panel" x="24" y="310" width="282" height="78" rx="12"/>
    <text class="sans tiny" x="44" y="340">Every surface shares</text>
    <text class="sans label" x="44" y="368">same authority graph</text>
    <rect class="panel" x="24" y="416" width="282" height="68" rx="12"/>
    <text class="sans tiny" x="44" y="446">Current status</text>
    <text class="sans label" x="44" y="472">Concept render</text>
  </g>
</svg>
