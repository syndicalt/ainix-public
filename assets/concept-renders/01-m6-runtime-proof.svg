<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ainix M6 verified runtime proof</title>
  <desc id="desc">A pitch render showing verified M6 runtime capabilities and commands.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071014"/>
      <stop offset="0.45" stop-color="#10171b"/>
      <stop offset="1" stop-color="#14100a"/>
    </linearGradient>
    <linearGradient id="terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101b20"/>
      <stop offset="1" stop-color="#061014"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <style>
      .sans { font-family: Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace; }
      .title { font-size: 70px; font-weight: 760; fill: #f7faf7; letter-spacing: 0; }
      .subtitle { font-size: 28px; fill: #b9c6c0; letter-spacing: 0; }
      .label { font-size: 24px; font-weight: 700; fill: #eaf3ee; letter-spacing: 0; }
      .small { font-size: 20px; fill: #aebbb7; letter-spacing: 0; }
      .tiny { font-size: 17px; fill: #92a29c; letter-spacing: 0; }
      .cmd { font-size: 23px; fill: #dce8e2; letter-spacing: 0; }
      .ok { fill: #49d391; }
      .warn { fill: #f0b84c; }
      .cyan { fill: #65d7df; }
      .panel { fill: rgba(255,255,255,0.055); stroke: rgba(255,255,255,0.14); stroke-width: 1.4; }
      .pill { fill: rgba(101,215,223,0.10); stroke: rgba(101,215,223,0.45); stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 745 C260 670 420 820 680 730 C940 640 1130 705 1600 610 L1600 900 L0 900 Z" fill="#0a2527" opacity="0.52"/>
  <path d="M0 690 C320 560 490 690 790 585 C1090 480 1260 540 1600 425" fill="none" stroke="#65d7df" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M0 770 C280 695 555 785 820 700 C1100 612 1250 650 1600 570" fill="none" stroke="#f0b84c" stroke-opacity="0.16" stroke-width="2"/>

  <g transform="translate(86 86)">
    <text class="sans title" x="0" y="0" dominant-baseline="hanging">Ainix M6 is real</text>
    <text class="sans subtitle" x="4" y="94">A verified local-first agent-native OS substrate, running as a hosted runtime today.</text>
  </g>

  <g transform="translate(90 222)" filter="url(#softShadow)">
    <rect width="890" height="520" rx="18" fill="url(#terminal)" stroke="#24363b" stroke-width="2"/>
    <rect width="890" height="58" rx="18" fill="#142228"/>
    <circle cx="33" cy="29" r="8" fill="#e85f5c"/>
    <circle cx="58" cy="29" r="8" fill="#f0b84c"/>
    <circle cx="83" cy="29" r="8" fill="#49d391"/>
    <text class="mono tiny" x="118" y="35">ainix@local: ~/Projects/Personal/ainix</text>

    <text class="mono cmd" x="34" y="103">$ cargo test --workspace --locked</text>
    <text class="mono cmd ok" x="780" y="103">PASS</text>
    <text class="mono cmd" x="34" y="154">$ cargo clippy --workspace --all-targets --locked -- -D warnings</text>
    <text class="mono cmd ok" x="780" y="154">PASS</text>
    <text class="mono cmd" x="34" y="205">$ cargo install --path crates/ainix-cli --locked</text>
    <text class="mono cmd ok" x="780" y="205">PASS</text>

    <rect x="34" y="246" width="822" height="1" fill="#223940"/>
    <text class="mono cmd cyan" x="34" y="291">M6 extension runtime</text>
    <text class="mono cmd" x="34" y="334">identity -> capability -> extension install -> execute -> audit</text>
    <text class="mono cmd" x="34" y="381">daemon IPC -> replay guard -> event log -> provenance</text>
    <text class="mono cmd" x="34" y="428">lattice export confinement + local API guardrails</text>
    <text class="mono cmd ok" x="34" y="481">commit 6dfd3fe: feat: stabilize M6 extension runtime</text>
  </g>

  <g transform="translate(1030 235)">
    <rect class="panel" width="470" height="92" rx="16"/>
    <text class="sans label" x="30" y="35">Authority primitives</text>
    <text class="sans small" x="30" y="66">Identity, capabilities, replay, audit</text>

    <rect class="panel" y="122" width="470" height="92" rx="16"/>
    <text class="sans label" x="30" y="157">Semantic substrate</text>
    <text class="sans small" x="30" y="188">Event log, lattice, provenance, export</text>

    <rect class="panel" y="244" width="470" height="92" rx="16"/>
    <text class="sans label" x="30" y="279">Extension boundary</text>
    <text class="sans small" x="30" y="310">Install, inspect, execute, deny, replay</text>

    <rect class="panel" y="366" width="470" height="92" rx="16"/>
    <text class="sans label" x="30" y="401">Local runtime</text>
    <text class="sans small" x="30" y="432">CLI today, daemon IPC, GUI next</text>
  </g>

  <g transform="translate(90 790)">
    <rect class="pill" width="330" height="48" rx="24"/>
    <text class="sans small" x="25" y="31">Current proof, not concept art</text>
  </g>
</svg>
