<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ainix architecture render</title>
  <desc id="desc">A layered architecture diagram for Ainix as a hosted agent-native operating layer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081013"/>
      <stop offset="0.55" stop-color="#13191b"/>
      <stop offset="1" stop-color="#17130d"/>
    </linearGradient>
    <style>
      .sans { font-family: Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 62px; font-weight: 780; fill: #f6faf7; letter-spacing: 0; }
      .subtitle { font-size: 26px; fill: #b7c5c0; letter-spacing: 0; }
      .layerTitle { font-size: 30px; font-weight: 750; fill: #f0f5f2; letter-spacing: 0; }
      .body { font-size: 21px; fill: #c1ccc7; letter-spacing: 0; }
      .small { font-size: 18px; fill: #94a39d; letter-spacing: 0; }
      .box { fill: rgba(255,255,255,0.055); stroke: rgba(255,255,255,0.16); stroke-width: 1.4; }
      .cyan { fill: rgba(101,215,223,0.12); stroke: rgba(101,215,223,0.5); }
      .green { fill: rgba(73,211,145,0.12); stroke: rgba(73,211,145,0.5); }
      .amber { fill: rgba(240,184,76,0.12); stroke: rgba(240,184,76,0.5); }
      .red { fill: rgba(236,104,86,0.10); stroke: rgba(236,104,86,0.45); }
      .line { stroke: #61706b; stroke-width: 2; stroke-opacity: 0.72; fill: none; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1250" cy="170" r="320" fill="#13333a" opacity="0.30"/>
  <circle cx="240" cy="760" r="300" fill="#362817" opacity="0.26"/>

  <text class="sans title" x="78" y="76">Ainix architecture</text>
  <text class="sans subtitle" x="82" y="150">A hosted OS layer for semantic work, local agents, provenance, and composable control surfaces.</text>

  <g transform="translate(80 230)">
    <rect class="box cyan" width="1440" height="104" rx="18"/>
    <text class="sans layerTitle" x="34" y="42">Control surfaces</text>
    <text class="sans body" x="34" y="75">CLI today | hosted canvas shell next | touch, voice, AR/VR, and dashboards later</text>
  </g>

  <g transform="translate(80 370)">
    <rect class="box green" width="1440" height="132" rx="18"/>
    <text class="sans layerTitle" x="34" y="43">System brokers</text>
    <text class="sans body" x="34" y="79">Session | shell | storage | model | context | event | canvas | presence | collaboration | extension</text>
    <text class="sans small" x="34" y="109">All authority-bearing work enters through broker contracts, capability proofs, and replay guards.</text>
  </g>

  <g transform="translate(80 540)">
    <rect class="box amber" width="1440" height="132" rx="18"/>
    <text class="sans layerTitle" x="34" y="43">Semantic OS substrate</text>
    <text class="sans body" x="34" y="79">Identity | capabilities | append-only event log | semantic lattice | provenance | policy | audit replay</text>
    <text class="sans small" x="34" y="109">Files and app data migrate into durable, inspectable, reversible workspace state.</text>
  </g>

  <g transform="translate(80 710)">
    <rect class="box red" width="1440" height="86" rx="18"/>
    <text class="sans layerTitle" x="34" y="38">Host platforms now, native system later</text>
    <text class="sans body" x="34" y="68">Windows + Aion/Windows ML | Linux | macOS | future Ainix shell, session manager, and kernel boundary</text>
  </g>

  <g>
    <path class="line" d="M800 334 L800 370"/>
    <path class="line" d="M800 502 L800 540"/>
    <path class="line" d="M800 672 L800 710"/>
    <circle cx="800" cy="352" r="5" fill="#65d7df"/>
    <circle cx="800" cy="522" r="5" fill="#49d391"/>
    <circle cx="800" cy="692" r="5" fill="#f0b84c"/>
  </g>

  <g transform="translate(1050 72)">
    <rect class="box" width="418" height="82" rx="16"/>
    <text class="sans body" x="24" y="35">Core differentiator</text>
    <text class="sans small" x="24" y="62">Migration-compatible semantic authority</text>
  </g>
</svg>
